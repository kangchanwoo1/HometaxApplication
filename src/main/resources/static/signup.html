<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <!-- Vue.js 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .signup-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        input:focus { border-color: #007bff; outline: none; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div id="app" class="signup-card">
        <h2>👤 회원가입</h2>
        
        <div class="form-group">
            <label>아이디</label>
            <input type="text" v-model="member.username" placeholder="사용할 아이디 입력">
        </div>
        
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" v-model="member.password" placeholder="비밀번호 입력">
        </div>
        
        <div class="form-group">
            <label>이름</label>
            <input type="text" v-model="member.name" placeholder="사용자 이름 입력">
        </div>
        
        <button @click="signup">가입하기</button>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const member = ref({
                    username: '',
                    password: '',
                    name: ''
                });

                const signup = async () => {
                    // 간단한 빈칸 검증
                    if (!member.value.username.trim() || !member.value.password.trim() || !member.value.name.trim()) {
                        alert("모든 항목을 입력해주세요!");
                        return;
                    }

                    try {
                        let response = await fetch('/member/signup', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(member.value)
                        });

                        let result = await response.text();
                        
                        if (result === "SUCCESS") {
                            alert("🎉 회원가입이 완료되었습니다!");
                            location.href = "/"; // 성공 시 이동할 메인 페이지 경로
                        } else {
                            alert("❌ 회원가입에 실패했습니다. (아이디 중복 등을 확인해주세요)");
                        }
                    } catch (error) {
                        console.error("통신 에러:", error);
                        alert("서버 통신 중 오류가 발생했습니다.");
                    }
                };

                return { member, signup };
            }
        }).mount("#app");
    </script>

</body>
</html>
