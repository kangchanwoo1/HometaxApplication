<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 900px; margin: auto; }
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f4f4f4; }
        .title-link { color: #0066cc; text-decoration: underline; cursor: pointer; text-align: left; padding-left: 15px; }
        .title-link:hover { color: #004080; }
        .btn-write { background-color: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-write:hover { background-color: #218838; }
        .del-btn { background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .del-btn:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <div id="app" class="container">
        <!-- 🎯 상단 타이틀과 [새 글 작성] 버튼 영역 -->
        <div class="header-box">
            <h2>📋 게시판 목록</h2>
            <button class="btn-write" @click="goToWrite">✏️ 새 게시글 작성</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>글번호</th>                    
                    <th>조회수</th>
                    <th>제목</th>                                                        
                    <th>작성자</th>                   
                    <th>등록일</th>
                    <th>관리</th>
                </tr>
            </thead>
          <tbody>
                <tr v-for="board in boardList" :key="board.boardId">
                    <td>{{ board.boardId }}</td>
                    <td>{{ board.viewCount }}</td>
                    <td><a :href="'detail.html?id=' + board.boardId">{{ board.title }}</a></td>                   
                    <td>{{ board.writer }}</td>                   
                    <td>{{ board.regDate ? board.regDate.replace('T', ' ').substring(0, 19) : '' }}</td>
                    <!-- 👇 관리 버튼들이 들어가는 6번째 <td>를 </tr> 안쪽으로 이동시켰습니다! -->
                    <td>
                        <button @click="goToDetail(board.boardId)">수정/보기</button>
                        <button type="button" class="del-btn" @click="deleteBoard(board.boardId)">🗑️ 삭제</button>
                    </td>
                </tr>
                
                <tr v-if="boardList.length === 0">
                    <td colspan="6">조회된 데이터가 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const boardList = ref([]);

                // 목록 조회
                const sbm_selectBoardList = async () => {
                    try {
                        let response = await fetch('/board/list');
                        if (response.ok) {
                            boardList.value = await response.json();
                        }
                    } catch (error) {
                        console.error("목록 조회 통신 에러:", error);
                    }
                };

                // 상세/수정 페이지로 이동
                const goToDetail = (id) => {
                    location.href = `detail.html?id=${id}`;
                };

                // 🎯 글쓰기 페이지로 이동하는 함수
                const goToWrite = () => {
                    location.href = `write.html`; // 앞서 만든 write.html로 이동
                };

                // 삭제 함수
                const deleteBoard = async (id) => {
                    if (!confirm("정말 삭제하시겠습니까?")) return;

                    try {
                        let response = await fetch(`/board/delete?id=${id}`, {
                            method: 'DELETE'
                        });
                        if (response.ok) {
                            alert("삭제되었습니다.");
                            sbm_selectBoardList();
                        } else {
                            alert("삭제 실패");
                        }
                    } catch (error) {
                        console.error("삭제 통신 에러:", error);
                    }
                };

                onMounted(() => {
                    sbm_selectBoardList();
                });

                return {
                    boardList,
                    goToDetail,
                    goToWrite,
                    deleteBoard
                };
            }
        }).mount("#app");
    </script>
</body>
</html>
