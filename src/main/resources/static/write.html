<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>새 글 작성</title>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-box { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 6px; background-color: #fafafa; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-save { background-color: #007bff; color: white; }
        .btn-back { background-color: #888; color: white; margin-left: 10px; }
    </style>
</head>
<body>

    <div id="app">
        <div class="form-box">
            <h2>✍️ 새 글 작성</h2>
            
            <div class="form-group">
                <label>작성자</label>
                <input type="text" v-model="boardMap.writer" placeholder="작성자를 입력하세요" />
            </div>
            
            <div class="form-group">
                <label>제목</label>
                <input type="text" v-model="boardMap.title" placeholder="제목을 입력하세요" />
            </div>
            
            <div class="form-group">
                <label>내용</label>
                <textarea v-model="boardMap.content" rows="6" placeholder="내용을 입력하세요"></textarea>
            </div>
            
            <div style="margin-top: 20px; text-align: right;">
                <button type="button" class="btn-save" @click="sbm_insertBoard">등록하기</button>
                <button type="button" class="btn-back" @click="goBack">취소</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, reactive } = Vue;

        createApp({
            setup() {
                const boardMap = reactive({
                	 writer: '',
                	 title: '',                                  
                     content: ''
                });

                // 새 글 등록 요청 함수 (POST)
                const sbm_insertBoard = async () => {
                    if (!boardMap.writer.trim() || !boardMap.title.trim() || !boardMap.content.trim()) {
                        alert("작성자, 제목, 내용을 모두 입력해 주세요.");
                        return;
                    }

                    // 백엔드 등록 API 주소 (필요시 백엔드 매핑 경로에 맞춰 수정 가능합니다)
                    let url = `/board/insert?writer=${encodeURIComponent(boardMap.writer)}&title=${encodeURIComponent(boardMap.title)}&content=${encodeURIComponent(boardMap.content)}`;

                    try {
                        let response = await fetch(url, {
                            method: 'POST'
                        });

                        if (response.ok) {
                            alert("게시글이 성공적으로 등록되었습니다!");
                            location.href = "index.html"; // 등록 완료 후 목록으로 이동
                        } else {
                            alert("등록에 실패했습니다.");
                        }
                    } catch (error) {
                        console.error("등록 통신 에러:", error);
                    }
                };

                const goBack = () => {
                    location.href = "index.html";
                };

                return {
                    boardMap,
                    sbm_insertBoard,
                    goBack
                };
            }
        }).mount("#app");
    </script>
</body>
</html>
